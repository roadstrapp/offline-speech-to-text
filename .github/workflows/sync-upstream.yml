name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://relay.ngit.dev/npub1jg2qmt3rxjksq65v3nk7dq6yaz2c4uf3qt9epdhxwms2xwd47j2s38a228/offline-speech-to-text.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "roadstr-upstream-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"

      - name: Fast-forward the pristine mirror
        run: |
          git fetch --tags upstream main
          git merge-base --is-ancestor origin/main upstream/main
          git merge --ff-only upstream/main
          # Push the branch on its own. `--follow-tags` sends the branch and
          # every missing tag in one push, and GitHub rejects the whole step
          # when any of those tags edits `.github/workflows`: GITHUB_TOKEN
          # has no workflows permission. A rejected tag must not throw away
          # the fast-forward or skip the engine sync below.
          git push origin HEAD:main
          remote_tags=$(mktemp)
          local_tags=$(mktemp)
          trap 'rm -f "$remote_tags" "$local_tags"' EXIT
          git ls-remote --tags origin | awk '{
            ref = $2
            sub(/^refs\/tags\//, "", ref)
            sub(/\^\{\}$/, "", ref)
            print ref
          }' | sort -u > "$remote_tags"
          git for-each-ref --format='%(objecttype) %(refname:strip=2)' --merged=HEAD refs/tags > "$local_tags"
          push_missing_tag() {
            kind=$1
            tag=$2
            if [ "$kind" != "tag" ]; then
              return 0
            fi
            if grep -Fxq "$tag" "$remote_tags"; then
              return 0
            fi
            echo "pushing tag $tag"
            if output=$(git push origin "refs/tags/${tag}" 2>&1); then
              printf '%s\n' "$output"
              return 0
            fi
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -F -q 'without `workflows` permission'; then
              echo "::warning title=Upstream tag not mirrored::${tag} changes .github/workflows, and the Actions token cannot publish that ref."
              return 0
            fi
            return 1
          }
          while read -r kind tag; do
            push_missing_tag "$kind" "$tag"
          done < "$local_tags"

      - name: Merge upstream into the embeddable-engine branch
        id: merge
        run: |
          git switch --force-create upstream-sync origin/engine/offline-stt-engine
          git merge --no-edit origin/main
          if git diff --quiet origin/engine/offline-stt-engine...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the extracted engine
        if: steps.merge.outputs.changed == 'true'
        run: cargo test --manifest-path engine/Cargo.toml --locked

      - name: Publish the reviewed sync branch
        if: steps.merge.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:automation/sync-upstream

      - name: Open or refresh the sync pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base engine/offline-stt-engine \
            --head automation/sync-upstream \
            --title "Sync engine branch with upstream" \
            --body "Automated merge of the latest pristine upstream main into the embeddable-engine branch. The engine test suite passed before this pull request was opened." || \
          gh pr edit automation/sync-upstream \
            --title "Sync engine branch with upstream" \
            --body "Automated merge of the latest pristine upstream main into the embeddable-engine branch. The engine test suite passed before this pull request was refreshed."
